<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1320" />
    <meta name="description" content="Spoilerfreies Trophäen-Navi: sagt dir, was als Nächstes zu tun ist, damit du keine Trophäe verpasst." />
    <title>Platinpfad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root">
      <section class="boot" id="pp-boot">
        <h1>Platinpfad lädt …</h1>
        <p>Bleibt diese Meldung stehen, läuft hier kein JavaScript. Öffne die Seite bitte direkt in einem Browser wie Chrome, Safari, Edge oder Firefox.</p>
      </section>
    </div>
    <script>
      // Zeigt Startfehler an, statt eine leere Seite zu hinterlassen (bewusst ES5).
      (function () {
        function show(msg) {
          var boot = document.getElementById('pp-boot');
          if (!boot) return;
          boot.innerHTML = '<h1>Platinpfad konnte nicht starten</h1><p>Schick diese Meldung bitte an das Team:</p><pre></pre>';
          boot.querySelector('pre').textContent = msg + '\n\n' + navigator.userAgent;
        }
        window.addEventListener('error', function (e) { show(e.message || String(e)); });
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
